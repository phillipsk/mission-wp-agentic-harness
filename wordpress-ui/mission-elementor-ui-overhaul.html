        desc: "Providing clean, new and gently used seasonal clothing with dignity and compassion to individuals and families throughout Somerville and Greater Boston.",
        ctaLabel: "Inquire or Donate",
        ctaHref: "https://missionchurchcooljc.com/contact/"
      },
      "Abundant Life Groups": {
        meta: "Tuesday Bible Study (7:30 PM on Zoom)",
        desc: "Our midweek discipleship rhythm brings the Mission Church family together Tuesday evenings at 7:30 PM on Zoom to dive deeply into Scripture, ask questions, and pray together.",
        ctaLabel: "Check Zoom Schedule",
        ctaHref: "https://missionchurchcooljc.com/mission-events/"
      },
      "Prayer Ministry": {
        meta: "Sun 10 AM · Mon 6:30 AM · Tue–Thu 7 AM",
        desc: "Interceding faithfully for our church, families, city, and world during Sunday pre-service Sanctuary Prayer and our live weekday Zoom prayer gatherings.",
        ctaLabel: "Submit a Prayer Request",
        ctaHref: "https://missionchurchcooljc.com/prayer/"
      },
      "Usher Board": {
        meta: "Sundays · Sanctuary Hospitality",
        desc: "Welcoming first-time guests and church members with a warm smile, assisting with seating, parking guidance, and orderly flow throughout our Sunday worship services.",
        ctaLabel: "Volunteer to Serve",
        ctaHref: "https://missionchurchcooljc.com/contact/"
      },
      "Allied Health": {
        meta: "Holistic Wellness & Health Fairs",
        desc: "Caring for the whole person—body, mind, and spirit—through community wellness education, annual health fairs, and preventative health support for our congregation and neighbors.",
        ctaLabel: "Reach Care Team",
        ctaHref: "https://missionchurchcooljc.com/contact/"
      }
    };

    function normPath(pathname) {
      var p = (pathname || "/").toLowerCase();
      if (!p.endsWith("/")) p += "/";
      return p;
    }

    function ensureTopNavAndSlider() {
      var p = normPath(window.location.pathname);
      if (p === "/") return;

      var topHeader = document.querySelector("header.elementor-top-section, header.elementor-section");
      var topWrap = topHeader
        ? topHeader.querySelector(".elementor-column > .elementor-widget-wrap")
        : null;

      // Ensure orphan pages (/abundant-life-groups/, /privacy-policy-2/) get matching header nav
      var existingNav = topWrap ? topWrap.querySelector(".elementor-widget-nav-menu") : null;
      if (!existingNav && document.body) {
        var bar = document.createElement("nav");
        bar.className = "mc-injected-topbar";
        bar.setAttribute("aria-label", "Primary Menu");
        bar.innerHTML =
          '<div class="mc-injected-topbar-inner">' +
          '<a href="https://missionchurchcooljc.com/">Home</a>' +
          '<a href="https://missionchurchcooljc.com/about-mission/">About</a>' +
          '<a href="https://missionchurchcooljc.com/im-new/">I\u2019m New</a>' +
          '<a href="https://missionchurchcooljc.com/photo-gallery/">Photo Gallery</a>' +
          '<a href="https://missionchurchcooljc.com/church-community-news/">News</a>' +
          '<a href="https://missionchurchcooljc.com/mission-events/">Mission Events</a>' +
          '<a href="https://missionchurchcooljc.com/ministries/">Ministries</a>' +
          '<a href="https://missionchurchcooljc.com/prayer/">Prayer</a>' +
          '<a href="https://missionchurchcooljc.com/give/">Give</a>' +
          '<a href="https://missionchurchcooljc.com/contact/">Contact</a>' +
          "</div>";
        if (topWrap) {
          topWrap.insertBefore(bar, topWrap.firstChild);
        } else {
          document.body.insertBefore(bar, document.body.firstChild);
        }
      } else if (existingNav && topWrap) {
        topWrap.insertBefore(existingNav, topWrap.firstChild);
      }

      var cfg = PAGE_SLIDERS[p];
      if (!cfg || !topWrap || topWrap.querySelector(".mc-hero-slider")) return;

      topWrap.querySelectorAll(".elementor-widget-image, .elementor-widget-heading").forEach(function (w) {
        w.classList.add("mc-legacy-hidden");
      });

      var slider = document.createElement("section");
      slider.className = "mc-hero-slider";
      slider.setAttribute("aria-label", cfg.title + " Photo Slider");

      var slidesHtml = cfg.slides
        .map(function (src, idx) {
          return (
            '<div class="mc-hero-slide' +
            (idx === 0 ? " is-active" : "") +
            '">' +
            '<div class="mc-hero-slide-bg" style="background-image:url(' +
            src +
            ')"></div>' +
            "</div>"
          );
        })
        .join("");

      var dotsHtml = cfg.slides
        .map(function (_, idx) {
          return (
            '<button type="button" class="mc-hero-dot' +
            (idx === 0 ? " is-active" : "") +
            '" aria-label="Slide ' +
            (idx + 1) +
            '" data-idx="' +
            idx +
            '"></button>'
          );
        })
        .join("");

      slider.innerHTML =
        slidesHtml +
        '<div class="mc-hero-scrim"></div>' +
        '<div class="mc-hero-content">' +
        '<span class="mc-hero-eyebrow">' +
        cfg.eyebrow +
        "</span>" +
        '<h1 class="mc-hero-title">' +
        cfg.title +
        "</h1>" +
        '<p class="mc-hero-subtitle">' +
        cfg.subtitle +
        "</p>" +
        "</div>" +
        '<button type="button" class="mc-hero-arrow is-prev" aria-label="Previous slide">\u2039</button>' +
        '<button type="button" class="mc-hero-arrow is-next" aria-label="Next slide">\u203a</button>' +
        '<div class="mc-hero-dots">' +
        dotsHtml +
        "</div>";

      var navEl = topWrap.querySelector(".elementor-widget-nav-menu, .mc-injected-topbar");
      if (navEl && navEl.nextSibling) {
        topWrap.insertBefore(slider, navEl.nextSibling);
      } else {
        topWrap.appendChild(slider);
      }
      document.body.classList.add("mc-slider-mounted");

      var cur = 0;
      var slides = slider.querySelectorAll(".mc-hero-slide");
      var dots = slider.querySelectorAll(".mc-hero-dot");
      function showSlide(n) {
        cur = (n + slides.length) % slides.length;
        slides.forEach(function (el, i) {
          el.classList.toggle("is-active", i === cur);
        });
        dots.forEach(function (el, i) {
          el.classList.toggle("is-active", i === cur);
        });
      }
      slider.querySelector(".is-prev").addEventListener("click", function () { showSlide(cur - 1); });
      slider.querySelector(".is-next").addEventListener("click", function () { showSlide(cur + 1); });
      dots.forEach(function (d) {
        d.addEventListener("click", function () { showSlide(Number(d.getAttribute("data-idx") || 0)); });
      });
      setInterval(function () { showSlide(cur + 1); }, 5500);
    }

    function polishPagesContent() {
      var p = normPath(window.location.pathname);

      // Home: fix "Tabitha'sCloset" typo
      try {
        if (p === "/") {
          document.querySelectorAll(".elementor-icon-box-title, h3").forEach(function (el) {
            if (el.textContent && el.textContent.indexOf("Tabitha'sCloset") !== -1) {
              el.textContent = el.textContent.replace("Tabitha'sCloset", "Tabitha's Closet");
            }
          });
        }
      } catch (e) {}

      // Ministries: clear stuck entrance animation class & enrich empty accordion panels
      try {
        if (p === "/ministries/") {
          document.querySelectorAll(".elementor-element-7660a5a1").forEach(function (el) {
            el.classList.remove("elementor-invisible", "animated", "slideInRight");
          });
          document.querySelectorAll(".elementor-accordion-item").forEach(function (item) {
            var titleEl = item.querySelector(".elementor-accordion-title");
            var contentEl = item.querySelector(".elementor-tab-content");
            if (!titleEl || !contentEl) return;
            var key = titleEl.textContent.trim();
            var info = MINISTRY_COPY[key];
            if (!info || contentEl.querySelector(".mc-ministry-panel")) return;
            if (contentEl.textContent.trim().length > 25) return;

            var img = contentEl.querySelector("img");
            var panel = document.createElement("div");
            panel.className = "mc-ministry-panel";
            var mediaDiv = document.createElement("div");
            mediaDiv.className = "mc-ministry-panel-media";
            if (img) mediaDiv.appendChild(img);

            var bodyDiv = document.createElement("div");
            bodyDiv.className = "mc-ministry-panel-body";
            bodyDiv.innerHTML =
              '<span class="mc-ministry-meta">' +
              info.meta +
              "</span>" +
              "<p>" +
              info.desc +
              "</p>" +
              '<a class="mc-pill-link" href="' +
              info.ctaHref +
              '">' +
              info.ctaLabel +
              " \u2192</a>";

            if (img) panel.appendChild(mediaDiv);
            panel.appendChild(bodyDiv);
            contentEl.innerHTML = "";
            contentEl.appendChild(panel);
          });
        }
      } catch (e) {}

      // Give: clear slideInDown animation & fix typos ("using and app" -> "using an app", "is build into" -> "is built into")
      try {
        if (p === "/give/") {
          document.querySelectorAll(".elementor-element-233c8aeb, .elementor-element-196f34c8, .elementor-element-259be5b0").forEach(function (el) {
            el.classList.remove("elementor-invisible", "animated", "slideInDown");
          });
          document.querySelectorAll(".elementor-icon-box-description").forEach(function (el) {
            el.textContent = el.textContent
              .replace(/\busing and app\b/gi, "using an app")
              .replace(/\bis build into\b/gi, "is built into");
          });
        }
      } catch (e) {}

      // I'm New: update Abundant Life Groups subtitle to active Tuesday Night Bible Study
      try {
        if (p === "/im-new/") {
          document.querySelectorAll(".elementor-icon-box-description").forEach(function (el) {
            if (el.textContent && el.textContent.trim() === "Abundant Life Groups") {
              el.textContent = "Tuesday Bible Study (Zoom · 7:30 PM)";
            }
          });
        }
      } catch (e) {}

      // Prayer: clarify Monday 6:30 AM & weekly prayer schedule
      try {
        if (p === "/prayer/") {
          document.querySelectorAll(".elementor-widget-text-editor p").forEach(function (el) {
            if (el.textContent && el.textContent.indexOf("6 AM on Zoom") !== -1) {
              el.textContent =
                "We gather for Sanctuary Prayer every Sunday at 10:00 AM, Pastor's Morning Prayer on Mondays at 6:30 AM on Zoom, and our Weekly Prayer Line Tuesday\u2013Thursday at 7:00 AM on Zoom.";
            }
          });
        }
      } catch (e) {}

      // Message Nuggets: upgrade http:// YouTube thumbnails to https://
      try {
        if (p === "/message-nuggets/") {
          document.querySelectorAll("img[src^='http://img.youtube.com']").forEach(function (img) {
            img.setAttribute("src", img.getAttribute("src").replace(/^http:\/\//, "https://"));
          });
        }
      } catch (e) {}

      // Contact: insert clean church info summary banner safely inside column wrap
      try {
        if (p === "/contact/") {
          var container = document.querySelector(".elementor-element-c005a35 .elementor-widget-wrap");
          if (container && !container.querySelector(".mc-contact-banner")) {
            var banner = document.createElement("div");
            banner.className = "mc-contact-banner";
            banner.innerHTML =
              "<div><h4>Visit Our Sanctuary</h4><p>130 Highland Avenue<br/>Somerville, MA 02143</p></div>" +
              "<div><h4>Sunday Schedule</h4><p>10:00 AM Prayer \u00b7 10:30 AM Sunday School<br/>12:00 PM Sunday Worship</p></div>" +
              "<div><h4>Direct Contact</h4><p>Phone: <a href='tel:6178636614'>(617) 863-6614</a><br/>Email: <a href='mailto:missionchurch1@gmail.com'>missionchurch1@gmail.com</a></p></div>";
            container.insertBefore(banner, container.firstChild);
          }
        }
      } catch (e) {}

      // Global Footer fixes (address capitalization, mailto:, © 2026)
      try {
        document.querySelectorAll('a[href*="MISSIONCHURCH"], a[href*="missionchurch1"]').forEach(function (a) {
          var href = a.getAttribute("href") || "";
          if (href.toLowerCase().indexOf("mailto") === 0 && href.indexOf("mailto:") !== 0) {
            a.setAttribute("href", "mailto:missionchurch1@gmail.com");
          }
        });

        document.querySelectorAll("footer, .elementor-location-footer, .elementor-element-6acf3bca").forEach(function (ftr) {
          ftr.querySelectorAll("h6").forEach(function (h) {
            if (/130\s+highland\s+avenue/i.test(h.textContent)) {
              h.textContent = "130 Highland Avenue, Somerville, MA 02143";
            }
          });
          ftr.querySelectorAll("p").forEach(function (pEl) {
            if (pEl.textContent.replace(/\u00a0/g, "").trim() === "" && !pEl.querySelector("img")) {
              pEl.style.display = "none";
            }
            if (pEl.innerHTML && pEl.innerHTML.indexOf("2025") !== -1 && pEl.innerHTML.indexOf("All Rights Reserved") !== -1) {
              pEl.innerHTML = pEl.innerHTML.replace(/©\s*2025\s*All Rights Reserved/gi, "© 2026 All Rights Reserved");
            }
          });
        });
      } catch (e) {}
    }

    function runAll() {
      ensureTopNavAndSlider();
      polishPagesContent();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runAll);
    } else {
      runAll();
    }
  })();
</script>
